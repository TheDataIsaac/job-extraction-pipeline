[project]
name = "job-extraction-pipeline"
version = "0.1.0"
description = "Turns messy freelance job postings into validated, structured data with an LLM."
readme = "README.md"
authors = [{ name = "Isaac Oresanya" }]
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "tenacity>=9.0",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ruff>=0.6",
]

[project.scripts]
jobs = "job_extraction.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_extraction"]

[tool.ruff]
line-length = 100
